<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>
  <style>
    :root { color-scheme: light; }
    body {
      font: 16px/1.4 system-ui, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fff;
      color: #000;
    }
    input, button {
      font: inherit;
      color: #000;
      background: #fff;
      border: 1px solid #000;
      padding: .35rem .6rem;
    }
    input::placeholder { color: #666; }
    button { background: #f2f2f2; }
    button:hover { background: #e6e6e6; }
    form.add { display: flex; gap: .5rem; }
    form.add input { flex: 1; }
    .toolbar { margin: .75rem 0; }
    .count, .empty { color: #555; }
    #board ul { list-style: none; padding: 0; margin: 0; }
    #board li { display: flex; gap: .5rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid #ddd; }
    #board li span { flex: 1; }
    #board li.done span { color: #555; text-decoration: line-through; }
  </style>
</head>
<body>
  <h1>Todos</h1>
  <form class="add" method="post" action="/todos"
        hx-post="/todos" hx-target="#board" hx-swap="innerHTML"
        hx-on:htmx:after-request="if (event.detail.successful) this.reset()">
    <input name="title" placeholder="What needs doing?" required maxlength="200" autofocus>
    <button>Add</button>
  </form>
  <p class="toolbar">
    <button type="button" hx-get="/todos" hx-target="#board" hx-swap="innerHTML">Refresh</button>
  </p>
  <div id="board"><!--BOARD--></div>
</body>
</html>
